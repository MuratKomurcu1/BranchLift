name: Debug e2e Linux permissions
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull alpine:3.22
      - run: npm run build
      - name: Run the failing e2e test with stack diagnostics
        run: BRANCHLIFT_DEBUG=1 BRANCHLIFT_E2E=1 node --test --test-name-pattern "creates two isolated stateful stacks" dist/test/docker-e2e.test.js 2>&1 | tail -120
