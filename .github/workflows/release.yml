name: Release npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - name: Preload the explicitly approved sandbox test image
        run: docker pull alpine:3.22
      - run: npm run test:e2e
      - run: npm run test:e2e:mongo-kafka
      - name: Build release tarball
        run: npm pack
      - name: Attach tarball to GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" branchlift-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm through OIDC
        run: npm publish --access public
