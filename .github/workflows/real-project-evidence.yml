name: Real project evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        project: [docmost, n8n, langfuse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose version
      - name: Run pinned lifecycle evidence
        run: npm run evidence:project -- --project "${{ matrix.project }}" --output "evidence-${{ matrix.project }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: branchlift-evidence-${{ matrix.project }}
          path: evidence-${{ matrix.project }}.json
          if-no-files-found: error
