<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
  <title id="title">BranchLift isolated state workflow</title>
  <desc id="description">One immutable backend snapshot is cloned into three isolated agent environments. A changed environment can be reset to its golden state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="0.54" stop-color="#111722"/>
      <stop offset="1" stop-color="#0c1119"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#77a7ff"/>
      <stop offset="1" stop-color="#356df3"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ae6b6"/>
      <stop offset="1" stop-color="#22a86d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#356df3" stop-opacity=".28"/>
      <stop offset="1" stop-color="#356df3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #8c96a8; }
      .line { stroke: #334156; stroke-width: 2; fill: none; }
      .dash { stroke-dasharray: 6 8; }
    </style>
  </defs>

  <rect width="1440" height="780" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="65" r="300" fill="url(#glow)"/>
  <circle cx="160" cy="720" r="250" fill="#25b979" opacity=".055"/>
  <path d="M0 110H1440M0 650H1440" stroke="#fff" stroke-opacity=".035"/>

  <g class="sans">
    <g transform="translate(56 45)">
      <rect width="42" height="42" rx="12" fill="url(#accent)" filter="url(#smallShadow)"/>
      <text x="21" y="27" text-anchor="middle" fill="white" font-size="12" font-weight="800">BL</text>
      <text x="56" y="18" fill="#f4f7fc" font-size="15" font-weight="700">BranchLift</text>
      <text x="56" y="35" class="muted" font-size="11">state isolation for parallel coding agents</text>
    </g>
    <g transform="translate(1090 52)">
      <rect width="106" height="28" rx="14" fill="#15291f" stroke="#2f7355"/>
      <circle cx="17" cy="14" r="4" fill="#55dda1"/>
      <text x="30" y="18" fill="#70e1ad" font-size="10" font-weight="700">LOCAL FIRST</text>
      <rect x="116" width="178" height="28" rx="14" fill="#182133" stroke="#314769"/>
      <text x="132" y="18" fill="#90b4ff" font-size="10" font-weight="700">NO HOSTED SERVICE</text>
    </g>

    <text x="56" y="145" fill="#f6f8fc" font-size="40" font-weight="730" letter-spacing="-1.5">One backend snapshot.</text>
    <text x="56" y="190" fill="#f6f8fc" font-size="40" font-weight="730" letter-spacing="-1.5">Every agent gets isolated state.</text>
    <text x="56" y="222" class="muted" font-size="14">Clone real PostgreSQL, Redis, queues, object stores, networks and ports — then commit, diff or reset.</text>

    <g transform="translate(56 275)" filter="url(#shadow)">
      <rect width="314" height="243" rx="19" fill="#181d27" stroke="#354158"/>
      <rect x="1" y="1" width="312" height="44" rx="18" fill="#1d2430"/>
      <circle cx="22" cy="23" r="5" fill="#ff5f57"/><circle cx="40" cy="23" r="5" fill="#febc2e"/><circle cx="58" cy="23" r="5" fill="#28c840"/>
      <text x="82" y="27" fill="#aeb7c7" font-size="10" font-weight="650">IMMUTABLE SOURCE</text>
      <g transform="translate(23 67)">
        <rect width="47" height="47" rx="13" fill="#1d3154"/>
        <path d="M14 17h19v16H14zM17 14h13v5H17z" fill="none" stroke="#75a4ff" stroke-width="2"/>
        <text x="62" y="18" fill="#f1f4fa" font-size="15" font-weight="700">dev</text>
        <text x="62" y="36" class="muted" font-size="10">golden snapshot</text>
      </g>
      <g transform="translate(23 135)">
        <rect width="268" height="40" rx="9" fill="#12161e" stroke="#293347"/>
        <circle cx="17" cy="20" r="5" fill="#3e7fe8"/>
        <text x="31" y="24" fill="#cdd5e2" font-size="10">PostgreSQL 16</text>
        <text x="175" y="24" fill="#59daa0" font-size="9" font-weight="700">STOPPED · CLEAN</text>
      </g>
      <g transform="translate(23 183)">
        <rect width="268" height="40" rx="9" fill="#12161e" stroke="#293347"/>
        <circle cx="17" cy="20" r="5" fill="#ed5f58"/>
        <text x="31" y="24" fill="#cdd5e2" font-size="10">Redis 7 + queues</text>
        <text x="203" y="24" fill="#59daa0" font-size="9" font-weight="700">GOLDEN</text>
      </g>
    </g>

    <path class="line" d="M370 396H415"/>
    <circle cx="432" cy="396" r="17" fill="#182c4d" stroke="#356df3"/>
    <path d="M425 396h14m-5-5 5 5-5 5" stroke="#8db2ff" stroke-width="2" fill="none"/>
    <path class="line dash" d="M449 396H483M466 396V302H505M466 396H505M466 396V490H505"/>

    <g transform="translate(505 266)" filter="url(#smallShadow)">
      <rect width="452" height="72" rx="14" fill="#171d27" stroke="#344158"/>
      <rect width="5" height="72" rx="3" fill="#5b8eff"/>
      <circle cx="38" cy="36" r="15" fill="#1e3154"/>
      <text x="38" y="41" text-anchor="middle" fill="#88adff" font-size="15">⌘</text>
      <text x="65" y="29" fill="#f1f4fa" font-size="13" font-weight="700">agent/fix-auth</text>
      <text x="65" y="48" class="muted mono" font-size="9">isolated DB · queue · network · ports</text>
      <rect x="342" y="22" width="88" height="28" rx="14" fill="#142c22" stroke="#275e47"/>
      <circle cx="359" cy="36" r="4" fill="#57dda2"/>
      <text x="371" y="40" fill="#6ee0ad" font-size="9" font-weight="700">HEALTHY</text>
    </g>
    <g transform="translate(505 360)" filter="url(#smallShadow)">
      <rect width="452" height="72" rx="14" fill="#171d27" stroke="#344158"/>
      <rect width="5" height="72" rx="3" fill="#a481ff"/>
      <circle cx="38" cy="36" r="15" fill="#30264f"/>
      <text x="38" y="41" text-anchor="middle" fill="#b9a4ff" font-size="15">⌘</text>
      <text x="65" y="29" fill="#f1f4fa" font-size="13" font-weight="700">agent/billing</text>
      <text x="65" y="48" class="muted mono" font-size="9">isolated DB · queue · network · ports</text>
      <rect x="342" y="22" width="88" height="28" rx="14" fill="#142c22" stroke="#275e47"/>
      <circle cx="359" cy="36" r="4" fill="#57dda2"/>
      <text x="371" y="40" fill="#6ee0ad" font-size="9" font-weight="700">HEALTHY</text>
    </g>
    <g transform="translate(505 454)" filter="url(#smallShadow)">
      <rect width="452" height="72" rx="14" fill="#171d27" stroke="#344158"/>
      <rect width="5" height="72" rx="3" fill="#4cd4a0"/>
      <circle cx="38" cy="36" r="15" fill="#173c31"/>
      <text x="38" y="41" text-anchor="middle" fill="#70e5b7" font-size="15">⌘</text>
      <text x="65" y="29" fill="#f1f4fa" font-size="13" font-weight="700">agent/migration</text>
      <text x="65" y="48" class="muted mono" font-size="9">isolated DB · queue · network · ports</text>
      <rect x="342" y="22" width="88" height="28" rx="14" fill="#142c22" stroke="#275e47"/>
      <circle cx="359" cy="36" r="4" fill="#57dda2"/>
      <text x="371" y="40" fill="#6ee0ad" font-size="9" font-weight="700">HEALTHY</text>
    </g>

    <g transform="translate(1004 275)" filter="url(#shadow)">
      <rect width="380" height="243" rx="19" fill="#181d27" stroke="#354158"/>
      <text x="24" y="34" fill="#aeb7c7" font-size="10" font-weight="700" letter-spacing="1">STATE LIFECYCLE</text>
      <g transform="translate(24 57)">
        <rect width="332" height="48" rx="11" fill="#291c21" stroke="#5f303a"/>
        <circle cx="24" cy="24" r="8" fill="#e85867"/>
        <path d="M20 24h8" stroke="white" stroke-width="2"/>
        <text x="44" y="21" fill="#f4d9dc" font-size="10">agent mutates database</text>
        <text x="44" y="35" fill="#cf8089" font-size="9">changed</text>
      </g>
      <path d="M190 108v16" stroke="#435068" stroke-width="2"/>
      <path d="m185 120 5 6 5-6" fill="none" stroke="#70809b" stroke-width="2"/>
      <g transform="translate(24 130)">
        <rect width="332" height="48" rx="11" fill="#17243a" stroke="#345487"/>
        <text x="18" y="29" fill="#9dbbff" class="mono" font-size="10">branchlift reset agent/fix-auth</text>
      </g>
      <path d="M190 181v15" stroke="#435068" stroke-width="2"/>
      <path d="m185 192 5 6 5-6" fill="none" stroke="#70809b" stroke-width="2"/>
      <g transform="translate(24 202)">
        <rect width="332" height="28" rx="9" fill="#142c22" stroke="#275e47"/>
        <circle cx="18" cy="14" r="5" fill="#57dda2"/>
        <text x="32" y="18" fill="#72e2b0" font-size="9" font-weight="700">GOLDEN STATE RESTORED</text>
        <text x="241" y="18" fill="#5f9b80" class="mono" font-size="8">verified</text>
      </g>
    </g>

    <g transform="translate(56 590)">
      <rect width="1328" height="128" rx="17" fill="#11161f" stroke="#2b3548"/>
      <text x="24" y="31" fill="#aeb7c7" font-size="9" font-weight="700" letter-spacing="1">THE MISSING STATE LAYER</text>
      <g transform="translate(24 48)">
        <rect width="390" height="56" rx="11" fill="#171e2a" stroke="#2e3c53"/>
        <circle cx="28" cy="28" r="14" fill="#1d3154"/><text x="28" y="33" text-anchor="middle" fill="#8db2ff" font-size="14">◫</text>
        <text x="52" y="23" fill="#f0f3f8" font-size="11" font-weight="700">Versioned backend state</text>
        <text x="52" y="40" class="muted" font-size="9">parent lineage · content digest · semantic diff</text>
      </g>
      <g transform="translate(469 48)">
        <rect width="390" height="56" rx="11" fill="#171e2a" stroke="#2e3c53"/>
        <circle cx="28" cy="28" r="14" fill="#17382e"/><text x="28" y="33" text-anchor="middle" fill="#74dfb3" font-size="14">◇</text>
        <text x="52" y="23" fill="#f0f3f8" font-size="11" font-weight="700">Least-privilege agent sandbox</text>
        <text x="52" y="40" class="muted" font-size="9">no host Docker socket · policy-gated secrets</text>
      </g>
      <g transform="translate(914 48)">
        <rect width="390" height="56" rx="11" fill="#171e2a" stroke="#2e3c53"/>
        <circle cx="28" cy="28" r="14" fill="#30264f"/><text x="28" y="33" text-anchor="middle" fill="#b7a0ff" font-size="14">↗</text>
        <text x="52" y="23" fill="#f0f3f8" font-size="11" font-weight="700">Local or your own SSH host</text>
        <text x="52" y="40" class="muted" font-size="9">live sync · tunnels · persistent BuildKit cache</text>
      </g>
    </g>
  </g>
</svg>
