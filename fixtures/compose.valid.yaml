services:
  api:
    image: node:22-alpine
    command: ["node", "-e", "require('http').createServer((_,r)=>r.end('ok')).listen(3000)"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: branchlift
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - target: 5432
        published: "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - type: volume
        source: redisdata
        target: /data

volumes:
  pgdata: {}
  redisdata: {}
